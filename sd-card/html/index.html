<script>
var streamPopup;var streamWindowFeatures='width=900,height=760,resizable=yes,scrollbars=yes';
function loadPage(page){document.getElementById('maincontent').src=page;document.querySelector('.ae-app').classList.remove('ae-nav-open');document.querySelector('.ae-mobile-menu').setAttribute('aria-expanded','false');}
    function flow_start() {
        if(cameraAvailable===false){alert('Camera unavailable. Connect the camera with power off, then restart.');return;}


    var url = getDomainname() + '/flow_start'; 

		var xhttp = new XMLHttpRequest();

		xhttp.onreadystatechange = function() {

			if (this.readyState == 4 && this.status == 200) {

                firework.launch(xhttp.responseText, 'success', 5000);

			    /*if (xhttp.responseText.substring(0,3) == "001") {

					firework.launch('Flow start triggered', 'success', 5000);

                    window.location.reload();

				}

				else if (xhttp.responseText.substring(0,3) == "002") {

					firework.launch('Flow start scheduled. Start after round is completed', 'success', 5000);

				}

				else if (xhttp.responseText.substring(0,3) == "099") {

					firework.launch('Flow start triggered, but start not possible (no flow task available)', 'danger', 5000);

                }*/

			}

		}

		xhttp.open("GET", url, true);

		xhttp.send();

    }

    



    function HA_send_discovery_visibility()	{

		loadConfig(domainname); 

		ParseConfig();

		category = getConfigCategory();

        param = getConfigParameters();

		

		if (category["MQTT"]["enabled"] && param["MQTT"]["HomeassistantDiscovery"].value1 == "true") {

            document.getElementById("ManualControl").style.display="";

            document.getElementById("HASendDiscovery").style.display="";

        }

	}



    function HA_send_discovery() {

    console.log("Homeassistant Discovery topic sending scheduled");

    var url = getDomainname() + '/mqtt_publish_discovery'; 

		var xhttp = new XMLHttpRequest();

		xhttp.onreadystatechange = function() {

			if (this.readyState == 4 && this.status == 200) {

				firework.launch('Sending Homeassistant discovery topics scheduled. It will get sent in the step "Publish to MQTT" of the next digitization round', 'success', 5000);

			}

		}

		xhttp.open("GET", url, true);

		xhttp.send();

    }



    function start_livestream(streamFlashlight) {
        if(cameraAvailable===false){alert('Camera unavailable. Connect the camera with power off, then restart.');return;}


        if (streamPopup) {

            streamPopup.close();

		}



        if (streamFlashlight) {

            streamPopup = window.open(getDomainname() + '/stream.html?flashlight=true','LivestreamWithlight',streamWindowFeatures);

		}

        else {

            streamPopup = window.open(getDomainname() + '/stream.html','Livestream',streamWindowFeatures);

		}



        if (streamPopup) streamPopup.focus();

    }


document.querySelectorAll('[data-page]').forEach(link=>link.addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('[data-page]').forEach(x=>x.removeAttribute('aria-current'));link.setAttribute('aria-current','page');document.getElementById('ae-page-title').textContent=link.dataset.title;history.replaceState(null,'',link.getAttribute('href'));loadPage(link.dataset.page);}));
document.querySelector('.ae-mobile-menu').addEventListener('click',function(){this.setAttribute('aria-expanded',String(document.body.classList.toggle('ae-nav-open')));});
let cameraAvailable=null;
fetch('/sysinfo',{cache:'no-store'}).then(r=>r.json()).then(data=>{const info=Array.isArray(data)?data[0]:data;cameraAvailable=info.camera_available;}).catch(()=>{});
const initial=document.querySelector('[data-page][href="'+(['#overview','#camera','#readings','#settings','#system'].includes(location.hash)?location.hash:'#overview')+'"]');initial.click();
LoadHostname();LoadFwVersion();LoadWebUiVersion();
if(location.hostname==='127.0.0.1'&&location.port==='8878')document.getElementById('ae-preview').hidden=false;
